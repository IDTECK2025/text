name: text
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  signature: ^6.3.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/Mulish-Light (1).ttf
        - asset: assets/fonts/Mulish-SemiBold (1).ttf
